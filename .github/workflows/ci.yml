name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify standard-library runtime (no packages to install)
        run: python -c "import sqlite3, ssl, urllib.request; print('Standard-library runtime ready')"
      - name: Offline behavioral tests
        run: python -m unittest -v
      - name: CLI smoke
        run: |
          python archiver.py demo
          python archiver.py demo
          python archiver.py export --db data/demo.db --channel CDEMO --output exports/demo.json
          python -c "import json; d=json.load(open('exports/demo.json', encoding='utf-8')); assert d['synthetic'] and len(d['messages']) == 3"
